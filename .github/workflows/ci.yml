name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Go server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: server

  ios:
    name: iOS app and ChatCore
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use the latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Test ChatCore
        working-directory: ios/ChatCore
        run: swift test
      - name: Build app for the iOS Simulator
        working-directory: ios/ChatApp
        run: |
          xcodebuild build \
            -project ChatApp.xcodeproj \
            -scheme ChatApp \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
